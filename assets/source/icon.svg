<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%"   stop-color="#22D3EE"/>
      <stop offset="45%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <radialGradient id="bg" cx="50%" cy="45%" r="72%">
      <stop offset="0%"   stop-color="#141C42"/>
      <stop offset="60%"  stop-color="#0A1130"/>
      <stop offset="100%" stop-color="#04081C"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed dark navy background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <!-- Soft glow pass behind the mark -->
    <g opacity="0.45" fill="none" stroke="url(#grad)" stroke-width="120"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- M -->
      <path d="M 162 710 L 162 310 L 322 550 L 482 310 L 482 710"/>
      <!-- ∞ -->
      <path d="M 542 510
               C 542 420, 622 420, 702 510
               C 782 600, 862 600, 862 510
               C 862 420, 782 420, 702 510
               C 622 600, 542 600, 542 510"/>
    </g>

    <!-- Crisp mark on top -->
    <g fill="none" stroke="url(#grad)" stroke-width="62"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- M -->
      <path d="M 162 710 L 162 310 L 322 550 L 482 310 L 482 710"/>
      <!-- ∞ -->
      <path d="M 542 510
               C 542 420, 622 420, 702 510
               C 782 600, 862 600, 862 510
               C 862 420, 782 420, 702 510
               C 622 600, 542 600, 542 510"/>
    </g>
  </g>
</svg>